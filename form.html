
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Data Diri</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .hobi {
            margin-top: 8px;
            font-weight: normal;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulir Data Diri</h2>

    <form action="hasil.php" method="POST">

        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" required>

        <label for="tanggal_lahir">Tanggal Lahir:</label>
        <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>

        <label>Hobi:</label>

        <div class="hobi">
            <input type="checkbox" name="hobi[]" value="Membaca">
            Membaca
        </div>

        <div class="hobi">
            <input type="checkbox" name="hobi[]" value="Olahraga">
            Olahraga
        </div>

        <div class="hobi">
            <input type="checkbox" name="hobi[]" value="Musik">
            Musik
        </div>

        <div class="hobi">
            <input type="checkbox" name="hobi[]" value="Lainnya">
            Lainnya
        </div>

        <button type="submit">Kirim</button>

    </form>
</div>

</body>
</html>
